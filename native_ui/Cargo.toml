[package]
name = "hls-native-ui"
version = "7.0.5"
edition = "2021"
description = "Native Windows presenter for HLS Downloader 7"
publish = false
autobins = false

[dependencies]
hls-client = { path = "../crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "hls-downloader-presenter"
path = "src/hot_main.rs"

[build-dependencies]
slint-build = "=1.17.1"
winresource = "0.1"
