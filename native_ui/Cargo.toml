[package]
name = "hls-native-ui"
version = "6.0.0"
edition = "2021"
description = "Native Windows workbench for HLS Downloader v6"
publish = false

[dependencies]
hls-native-shell = { path = "../native_shell", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.16"

[[bin]]
name = "HLSDownloader"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.16"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
