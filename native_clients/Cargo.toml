[package]
name = "hls-native-clients"
version = "7.0.5"
edition = "2021"
publish = false

[dependencies]
hls-client = { path = "../crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
# Host regressions using Core's private durable-state fixtures are compiled once
# by native_shell's unit harness from the canonical Host source.
test = false

[build-dependencies]
winresource = "0.1"

[[bin]]
name = "HLSDownloader"
path = "src/bin/hls_downloader.rs"

[[bin]]
name = "HLSDownloaderCli"
path = "src/bin/hls_downloader_cli.rs"

[[bin]]
name = "HLSDownloaderNativeHost"
path = "src/bin/hls_downloader_native_host.rs"

[[bin]]
name = "HLSDownloaderUpdater"
path = "src/bin/hls_downloader_updater.rs"
