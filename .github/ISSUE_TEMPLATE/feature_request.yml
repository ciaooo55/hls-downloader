name: 功能建议 / Feature Request
description: 提出面向桌面工作台、多协议下载核心、浏览器扩展或流媒体播放/混流的改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议与体验打磨想法！
        - 提交前建议先查阅 `README.md` 与 `docs/README.md`，确认现有功能（如静默快下、过期签名刷新续传、CLI、抓站同步、远程 ZIP 预览等）是否已覆盖你的需求。
        - 请注意安全与合规边界：本项目**不接受**任何绕过 DRM（Widevine / PlayReady / EME / SAMPLE-AES）或规避网站访问控制的请求。

  - type: dropdown
    id: scope
    attributes:
      label: 建议所属方向 / Target Scope
      multiple: true
      options:
        - Desktop (桌面工作台、任务检视抽屉、弹窗与快捷键交互)
        - Extension (Chromium / Firefox 浏览器扩展、嗅探浮层与接管规则)
        - Core (HTTP / FTP / SFTP / BT 多协议引擎、队列调度与代理路由)
        - Media (HLS / DASH 流媒体混流封装、libmpv 本地播放、字幕与局域网投屏)
        - CLI & Tooling (命令行、批量导入导出、抓站同步或安装包体验)
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与痛点问题 / Problem or Use Case
      description: 描述你在什么实际场景下遇到了不便，为什么现有流程难以满足需求？
      placeholder: "例如：在批量管理数十个分段任务时，希望能够..."
    validations:
      required: true

  - type: textarea
    id: proposed_behavior
    attributes:
      label: 期望的功能与交互设计 / Proposed Behavior
      description: 具体说明你希望新增怎样的入口、配置项、默认行为或边界处理。
      placeholder: "希望在...位置提供...操作，触发后..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或参考补充 / Alternatives & Context（可选）
      description: 你目前采用的变通做法，或其他有帮助的上下文说明。
    validations:
      required: false
