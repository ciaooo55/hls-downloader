name: v7 One-shot FFplay Slimming Prep

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  prepare:
    if: ${{ github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'maintenance:prepare-v7.0.2-ffplay-slimming' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out slimming branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-0-2-remove-unused-ffplay
          fetch-depth: 0

      - name: Remove ffplay from final package contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts\build-v7.ps1'
          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $oldTools = '$requiredMediaTools = @(''ffmpeg.exe'', ''ffprobe.exe'', ''ffplay.exe'')'
          $newTools = '$requiredMediaTools = @(''ffmpeg.exe'', ''ffprobe.exe'')'
          if (-not $text.Contains($oldTools)) { throw 'Expected three-tool package contract was not found.' }
          $text = $text.Replace($oldTools, $newTools)
          $text = $text.Replace('Candidate/formal packaging requires HLS_V7_FFMPEG_DIR or ffmpeg.exe on PATH; ffmpeg, ffprobe and ffplay must come from the same directory.', 'Candidate/formal packaging requires HLS_V7_FFMPEG_DIR or ffmpeg.exe on PATH; packaged ffmpeg and ffprobe must come from the same verified media-tool directory.')
          $text = $text.Replace('Candidate/formal packaging requires ffmpeg.exe, ffprobe.exe and ffplay.exe in one directory.', 'Candidate/formal packaging requires ffmpeg.exe and ffprobe.exe in one verified media-tool directory.')
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))

          $readme = 'README.md'
          $readmeText = Get-Content -LiteralPath $readme -Raw -Encoding UTF8
          $oldReadme = 'Candidate and formal packaging require `ffmpeg.exe`, `ffprobe.exe` and `ffplay.exe` from one directory: set `HLS_V7_FFMPEG_DIR` explicitly, or place all three beside the `ffmpeg.exe` resolved from `PATH`.'
          $newReadme = 'Candidate and formal packaging source media tools from one verified FFmpeg directory. The shipped runtime requires `ffmpeg.exe` and `ffprobe.exe`; `ffplay.exe` remains part of the pinned upstream tool bundle used during bootstrap verification but is not shipped because local playback uses bundled libmpv.'
          if (-not $readmeText.Contains($oldReadme)) { throw 'Expected README media-tool contract was not found.' }
          $readmeText = $readmeText.Replace($oldReadme, $newReadme)
          [IO.File]::WriteAllText((Resolve-Path $readme), $readmeText, [Text.UTF8Encoding]::new($false))
          git diff --check

      - name: Commit slimming preparation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-v7.ps1 README.md
          if (git diff --cached --quiet) { throw 'FFplay slimming preparation produced no changes.' }
          git commit -m 'build: stop shipping unused ffplay runtime'
          git push origin HEAD:chatgpt/v7-0-2-remove-unused-ffplay
