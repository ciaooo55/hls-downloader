name: Fix rusqlite 0.40 once

on:
  push:
    branches:
      - dependabot/cargo/native_shell/rusqlite-0.40.2
    paths:
      - '.github/workflows/fix-rusqlite-040-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: dependabot/cargo/native_shell/rusqlite-0.40.2

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'

      - name: Adapt rusqlite integer binding and regenerate presenter lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $path = 'native_shell/src/store.rs'
          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $old = @'
    transaction
        .execute(
            r#"INSERT INTO tasks(task_id, snapshot_json, created_at_ms, updated_at_ms, event_sequence)
               VALUES (?1, ?2, ?3, ?3, ?4)
               ON CONFLICT(task_id) DO UPDATE SET
                 snapshot_json = excluded.snapshot_json,
                 updated_at_ms = excluded.updated_at_ms,
                 event_sequence = excluded.event_sequence"#,
            params![snapshot.task_id, json, now, sequence],
        )
'@
          $new = @'
    let sequence = i64::try_from(sequence)
        .map_err(|_| format!("Core task {} event sequence exceeds SQLite INTEGER range", snapshot.task_id))?;
    transaction
        .execute(
            r#"INSERT INTO tasks(task_id, snapshot_json, created_at_ms, updated_at_ms, event_sequence)
               VALUES (?1, ?2, ?3, ?3, ?4)
               ON CONFLICT(task_id) DO UPDATE SET
                 snapshot_json = excluded.snapshot_json,
                 updated_at_ms = excluded.updated_at_ms,
                 event_sequence = excluded.event_sequence"#,
            params![snapshot.task_id, json, now, sequence],
        )
'@
          if (-not $text.Contains($old)) { throw 'Expected upsert_task SQL block was not found.' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))

          cargo generate-lockfile --manifest-path presenter_ui/Cargo.toml
          cargo metadata --locked --no-deps --format-version 1 --manifest-path presenter_ui/Cargo.toml | Out-Null
          cargo fmt --manifest-path native_shell/Cargo.toml --all -- --check
          git diff --check
          git diff -- native_shell/src/store.rs presenter_ui/Cargo.lock

      - name: Commit migration fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native_shell/src/store.rs presenter_ui/Cargo.lock
          if (git diff --cached --quiet) { throw 'No rusqlite compatibility changes were produced.' }
          git commit -m 'fix: adapt persistence to rusqlite 0.40'
          git push origin HEAD:dependabot/cargo/native_shell/rusqlite-0.40.2
