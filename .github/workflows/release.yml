name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in the installer, for example 3.0.10
        required: false
        default: "3.0.30"
      include_extensions:
        description: Upload browser extension ZIPs for this release
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Decide whether extension assets changed
        id: extension-assets
        shell: pwsh
        env:
          REQUESTED_INCLUDE_EXTENSIONS: ${{ inputs.include_extensions }}
        run: |
          $include = $env:REQUESTED_INCLUDE_EXTENSIONS -eq "true"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $previousTag = & git describe --tags --abbrev=0 "$env:GITHUB_REF_NAME^" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $previousTag) {
              $include = $true
            } else {
              $changedExtensionFiles = @(& git diff --name-only $previousTag $env:GITHUB_REF_NAME -- extension)
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to compare extension changes with $previousTag"
              }
              $include = $changedExtensionFiles.Count -gt 0
            }
          }
          "include_extensions=$($include.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Include extension release assets: $include"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt
            requirements-release.lock
            backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2

      - name: Set up Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-release.lock
          Push-Location frontend
          pnpm install --frozen-lockfile
          Pop-Location
          Push-Location extension
          pnpm install --frozen-lockfile
          Pop-Location

      - name: Run verification
        shell: pwsh
        run: |
          python -m ruff check backend tests scripts/smoke_real_download.py scripts/smoke_extension_browsers.py scripts/smoke_extension_media.py scripts/smoke_extension_takeover.py
          python -m mypy `
            backend/app/api.py `
            backend/app/credentials.py `
            backend/app/network_proxy.py `
            backend/app/database.py `
            backend/app/config.py `
            backend/app/schemas.py `
            backend/app/access_tokens.py `
            backend/app/utils.py `
            backend/app/downloader/disk_space.py `
            backend/app/downloader/dash_native.py `
            backend/app/downloader/errors.py `
            backend/app/downloader/hls.py `
            backend/app/downloader/playback.py `
            backend/app/downloader/response_validation.py `
            backend/app/downloader/task_manager.py `
            backend/app/windows_attachment.py `
            backend/app/updater.py
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/validate-powershell.ps1
          pwsh.exe -NoProfile -File scripts/validate-powershell.ps1
          python -m pytest -q --cov=backend.app --cov-report=term-missing --cov-fail-under=60
          Push-Location frontend
          pnpm test
          pnpm run build
          Pop-Location
          Push-Location frontend/src-tauri
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          Pop-Location
          Push-Location extension
          pnpm test
          pnpm run build
          pnpm exec web-ext lint --source-dir .output/firefox-mv3 --warnings-as-errors
          Pop-Location

      - name: Load built extensions in Chrome and Firefox
        timeout-minutes: 5
        shell: pwsh
        run: |
          python scripts/smoke_extension_browsers.py `
            --extension-output extension/.output `
            --chrome-binary "${{ steps.chrome.outputs.chrome-path }}" `
            --firefox-binary "${{ steps.firefox.outputs.firefox-path }}"
          python scripts/smoke_extension_media.py `
            --browser firefox `
            --extension extension/.output/firefox-mv3 `
            --browser-binary "${{ steps.firefox.outputs.firefox-path }}"
          python scripts/smoke_extension_takeover.py `
            --browser chrome `
            --extension extension/.output/chrome-mv3 `
            --browser-binary "${{ steps.chrome.outputs.chrome-path }}"

      - name: Build Windows packages
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          $buildArgs = @{ Version = $version }
          if ("${{ steps.extension-assets.outputs.include_extensions }}" -eq "true") {
            $buildArgs.IncludeExtensionAssets = $true
          }
          & .\scripts\build_installer.ps1 @buildArgs

      - name: Assemble and verify release files
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          $prefix = "HLSDownloader-v$version"
          $expected = @(
            "$prefix-Windows-x64-Setup.exe",
            "$prefix-Windows-x64-Portable.zip"
          )
          if ("${{ steps.extension-assets.outputs.include_extensions }}" -eq "true") {
            $expected += @(
              "$prefix-Chrome-Edge-Extension.zip",
              "$prefix-Firefox-Unsigned.zip",
              "$prefix-Firefox-Source.zip"
            )
          }
          foreach ($name in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path .\release $name))) {
              throw "Missing release file: $name"
            }
          }
          $actual = @(Get-ChildItem .\release -File)
          if ($actual.Count -ne $expected.Count) {
            throw "Release directory must contain exactly $($expected.Count) files; found $($actual.Count)"
          }

      - name: Smoke-test packaged downloads and portable upgrade
        timeout-minutes: 15
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          $archive = Join-Path .\release "HLSDownloader-v$version-Windows-x64-Portable.zip"
          python scripts/smoke_real_download.py --archive $archive
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/smoke-portable-upgrade.ps1 `
            -ArchivePath $archive
          $installer = Join-Path .\release "HLSDownloader-v$version-Windows-x64-Setup.exe"
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/smoke-installer-upgrade.ps1 `
            -InstallerPath $installer

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: HLSDownloader-Windows-x64-${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download verified Windows assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: HLSDownloader-Windows-x64-${{ github.ref_name }}
          path: release

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem .\release -File | Select-Object -ExpandProperty FullName)
          if ($files.Count -eq 0) {
            throw "No release files were downloaded."
          }
          $notesPath = Join-Path .\docs\releases "${{ github.ref_name }}.md"
          $notesArguments = if (Test-Path -LiteralPath $notesPath) {
            @("--notes-file", $notesPath)
          } else {
            @("--generate-notes")
          }
          & gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload "${{ github.ref_name }}" @files `
              --repo "${{ github.repository }}" `
              --clobber
          } else {
            & gh release create "${{ github.ref_name }}" @files `
              --repo "${{ github.repository }}" `
              --verify-tag `
              --title "HLS Downloader ${{ github.ref_name }}" `
              @notesArguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }
