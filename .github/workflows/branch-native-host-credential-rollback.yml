name: Branch Native Host credential rollback

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-native-host-credential-rollback.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "网页版gpt"

      - name: Guard target branch
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }

      - name: Apply credential rollback patch
        run: python scripts/branch-native-host-credential-rollback.py

      - name: Format Rust
        run: cargo fmt --manifest-path native_shell/Cargo.toml

      - name: Check native shell
        run: cargo check --manifest-path native_shell/Cargo.toml

      - name: Run credential rollback regressions
        run: |
          cargo test --manifest-path native_shell/Cargo.toml delete_credential_request_roundtrip_preserves_identity -- --test-threads=1
          cargo test --manifest-path native_shell/Cargo.toml credential_delete_roundtrips_over_ipc -- --test-threads=1
          cargo test --manifest-path native_shell/Cargo.toml download_credential_rollback_is_transactional -- --test-threads=1

      - name: Commit tested core patch on target branch only
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/core_ipc.rs native_shell/src/core_server.rs native_shell/src/download_worker.rs native_shell/src/native_host.rs
          git commit -m "fix(native-host): roll back orphan replay credentials"
          git push origin HEAD:"网页版gpt"
