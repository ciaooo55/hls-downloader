name: Branch duplicate request identity fix

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-duplicate-identity-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "网页版gpt"

      - name: Guard target branch
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }

      - name: Apply duplicate identity patch
        run: python .github/scripts/apply_duplicate_identity_fix.py

      - name: Format Rust
        run: cargo fmt --manifest-path native_shell/Cargo.toml

      - name: Check native shell
        run: cargo check --manifest-path native_shell/Cargo.toml

      - name: Run focused duplicate regression
        run: cargo test --manifest-path native_shell/Cargo.toml duplicate_identity_requires_same_safe_request_shape

      - name: Commit tested core patch on target branch only
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/download_worker.rs
          git commit -m "fix(core): include request identity in duplicate reuse"
          git push origin HEAD:"网页版gpt"
