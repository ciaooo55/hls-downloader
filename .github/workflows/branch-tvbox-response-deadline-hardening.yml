name: Branch TVBox response deadline hardening

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/branch_tvbox_response_deadline_hardening.py"
      - ".github/workflows/branch-tvbox-response-deadline-hardening.yml"

permissions:
  contents: write

jobs:
  patch-tvbox-response-deadline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "网页版gpt"
          fetch-depth: 0

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Apply TVBox response deadline patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/branch_tvbox_response_deadline_hardening.py

      - name: Format, test and commit product change
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location native_shell
          try {
            cargo fmt --all
            cargo test --locked --lib tvbox_http_response_has_total_read_deadline -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --lib tvbox_http_response_is_bounded -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --lib tvbox_push_falls_back_from_post_to_get -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          git diff --check
          $changed = @(git diff --name-only | Sort-Object)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'native_shell/src/cast.rs') {
            throw "Unexpected changed files: $($changed -join ', ')"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/cast.rs
          git commit -m "fix(cast): enforce TVBox response read deadline"

      - name: Remove temporary branch patch machinery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/branch_tvbox_response_deadline_hardening.py .github/workflows/branch-tvbox-response-deadline-hardening.yml
          git commit -m "chore(branch): remove temporary TVBox response deadline patch"
          git fetch origin "$env:GITHUB_REF_NAME"
          git rebase "origin/$env:GITHUB_REF_NAME"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
