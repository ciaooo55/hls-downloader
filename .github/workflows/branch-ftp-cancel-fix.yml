name: Branch FTP stalled-read cancellation fix

on:
  push:
    branches:
      - '网页版gpt'
    paths:
      - 'scripts/branch-ftp-cancel-fix.py'
      - '.github/workflows/branch-ftp-cancel-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '网页版gpt'
          fetch-depth: 0

      - name: Guard target branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -ne '网页版gpt') { throw 'wrong branch' }
          if ((git branch --show-current).Trim() -ne '网页版gpt') { throw 'checkout is not 网页版gpt' }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Apply FTP cancellation patch
        shell: pwsh
        run: python scripts/branch-ftp-cancel-fix.py

      - name: Format Rust
        working-directory: native_shell
        shell: pwsh
        run: cargo fmt --all

      - name: Check native shell
        working-directory: native_shell
        shell: pwsh
        run: cargo check --locked

      - name: Run focused FTP regressions
        working-directory: native_shell
        shell: pwsh
        run: cargo test --locked ftp_engine::tests:: -- --test-threads=1

      - name: Commit tested core patch on target branch only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current).Trim() -ne '网页版gpt') { throw 'refusing to commit outside 网页版gpt' }
          git add -- native_shell/src/ftp_engine.rs
          if (git diff --cached --quiet) { throw 'FTP cancellation patch produced no source changes' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ftp): interrupt stalled data reads on task control'
          git push origin HEAD:'网页版gpt'
