name: Branch FTP stalled-read cancellation fix

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-ftp-cancel-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "网页版gpt"

      - name: Guard target branch
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }

      - name: Apply FTP cancellation patch
        shell: pwsh
        run: |
          python scripts/branch-ftp-cancel-fix.py
          $path = "native_shell/src/ftp_engine.rs"
          $text = Get-Content $path -Raw
          $old = '        assert_eq!(error, action);'
          $new = '        assert_eq!(error, if action == "pause" { "paused" } else { "canceled" });'
          if (-not $text.Contains($old)) { throw "FTP regression assertion anchor missing" }
          Set-Content -Path $path -Value ($text.Replace($old, $new)) -Encoding utf8 -NoNewline

      - name: Format Rust
        run: cargo fmt --manifest-path native_shell/Cargo.toml

      - name: Check native shell
        run: cargo check --manifest-path native_shell/Cargo.toml

      - name: Run focused FTP regressions
        run: |
          cargo test --manifest-path native_shell/Cargo.toml ftp_engine::tests:: -- --test-threads=1

      - name: Commit tested core patch on target branch only
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/ftp_engine.rs
          git commit -m "fix(ftp): interrupt stalled data reads on task control"
          git push origin HEAD:"网页版gpt"
