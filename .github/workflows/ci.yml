name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check backend tests scripts/smoke_real_download.py scripts/smoke_extension_browsers.py

      - name: Type-check security-critical Python modules
        shell: pwsh
        run: |
          python -m mypy `
            backend/app/credentials.py `
            backend/app/network_proxy.py `
            backend/app/database.py `
            backend/app/config.py `
            backend/app/schemas.py

      - name: Run Python tests with coverage gate
        run: python -m pytest -q --cov=backend.app --cov-report=term-missing --cov-fail-under=60

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Check and lint Tauri desktop shell
        working-directory: frontend/src-tauri
        run: |
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build Tauri desktop shell
        working-directory: frontend
        run: pnpm run tauri:build

      - name: Test and build browser extensions
        working-directory: extension
        run: |
          pnpm test
          pnpm run build
          pnpm exec web-ext lint --source-dir .output/firefox-mv3 --warnings-as-errors

      - name: Load built extensions in Chrome and Firefox
        timeout-minutes: 5
        shell: pwsh
        run: |
          python scripts/smoke_extension_browsers.py `
            --extension-output extension/.output `
            --chrome-binary "${{ steps.chrome.outputs.chrome-path }}" `
            --firefox-binary "${{ steps.firefox.outputs.firefox-path }}"

