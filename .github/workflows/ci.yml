name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            backend/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check backend tests scripts/smoke_real_download.py scripts/smoke_extension_browsers.py scripts/smoke_extension_media.py scripts/smoke_extension_takeover.py

      - name: Validate user-facing PowerShell in 5.1 and 7
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/validate-powershell.ps1
          pwsh.exe -NoProfile -File scripts/validate-powershell.ps1

      - name: Type-check security-critical Python modules
        shell: pwsh
        run: |
          python -m mypy `
            backend/app/api.py `
            backend/app/credentials.py `
            backend/app/network_proxy.py `
            backend/app/database.py `
            backend/app/config.py `
            backend/app/schemas.py `
            backend/app/access_tokens.py `
            backend/app/utils.py `
            backend/app/downloader/disk_space.py `
            backend/app/downloader/dash_native.py `
            backend/app/downloader/errors.py `
            backend/app/downloader/hls.py `
            backend/app/downloader/playback.py `
            backend/app/downloader/response_validation.py `
            backend/app/downloader/task_manager.py `
            backend/app/windows_attachment.py `
            backend/app/updater.py

      - name: Run Python tests with coverage gate
        run: python -m pytest -q --cov=backend.app --cov-report=term-missing --cov-fail-under=60

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2

      - name: Set up Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Check and lint Tauri desktop shell
        working-directory: frontend/src-tauri
        run: |
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Check native supervisor
        working-directory: native_shell
        run: cargo test --locked

      - name: Build Tauri desktop shell
        working-directory: frontend
        run: pnpm run tauri:build

      - name: Test and build browser extensions
        working-directory: extension
        run: |
          pnpm test
          pnpm run build
          pnpm exec web-ext lint --source-dir .output/firefox-mv3 --warnings-as-errors

      - name: Load built extensions in Chrome and Firefox
        timeout-minutes: 5
        shell: pwsh
        run: |
          python scripts/smoke_extension_browsers.py `
            --extension-output extension/.output `
            --chrome-binary "${{ steps.chrome.outputs.chrome-path }}" `
            --firefox-binary "${{ steps.firefox.outputs.firefox-path }}"
          python scripts/smoke_extension_media.py `
            --browser firefox `
            --extension extension/.output/firefox-mv3 `
            --browser-binary "${{ steps.firefox.outputs.firefox-path }}"
          python scripts/smoke_extension_takeover.py `
            --browser chrome `
            --extension extension/.output/chrome-mv3 `
            --browser-binary "${{ steps.chrome.outputs.chrome-path }}"

