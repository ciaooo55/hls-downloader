name: v7 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Java 21
        uses: actions/setup-java@7a445ee88d4e23b52c33d449d511d6d8d023fe97
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Validate PowerShell 5.1 and 7
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/validate-powershell.ps1
          pwsh.exe -NoProfile -ExecutionPolicy Bypass -File scripts/validate-powershell.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-v7-feature-parity.ps1
          pwsh.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-v7-feature-parity.ps1

      - name: Test and lint Rust Core
        working-directory: native_shell
        run: |
          cargo test --locked --lib
          cargo clippy --locked --all-targets

      - name: Test and build native presenter
        working-directory: presenter_ui
        run: |
          cargo test --locked
          cargo build --locked --bin hls-downloader-presenter

      - name: Test Compose workbench
        working-directory: desktop_ui
        run: .\gradlew.bat test --no-daemon

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Test and build browser extensions
        working-directory: extension
        run: |
          pnpm test
          pnpm run build
