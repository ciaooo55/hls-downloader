name: v7 CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Guard active v7 source ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'config.default.json') {
            throw 'Legacy config.default.json must not return: Rust Core and the versioned protocol own active v7 settings/defaults.'
          }

      - name: Validate PowerShell 5.1 and 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/validate-powershell.ps1
          pwsh.exe -NoProfile -ExecutionPolicy Bypass -File scripts/validate-powershell.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-v7-feature-parity.ps1
          pwsh.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-v7-feature-parity.ps1

  rust_core:
    name: Rust Core
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust Core dependencies and target
        uses: actions/cache@a102210dd13b6f687ffa4262c9f08b3c00d3c459
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v7-rust-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native_shell/Cargo.lock', 'native_shell/Cargo.toml') }}

      - name: Test, build and lint Rust Core
        working-directory: native_shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --lib
          cargo build --locked --bin HLSDownloaderUpdater
          cargo clippy --locked --all-targets

  presenter:
    name: Native presenter
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache presenter dependencies and target
        uses: actions/cache@a102210dd13b6f687ffa4262c9f08b3c00d3c459
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v7-presenter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('presenter_ui/Cargo.lock', 'presenter_ui/Cargo.toml', 'native_shell/Cargo.lock', 'native_shell/Cargo.toml') }}

      - name: Test and build native presenter
        working-directory: presenter_ui
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked
          cargo build --locked --bin hls-downloader-presenter

  compose:
    name: Compose workbench and distribution
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test Compose workbench
        working-directory: desktop_ui
        shell: pwsh
        run: .\gradlew.bat test --no-daemon

      - name: Build Compose distribution image
        working-directory: desktop_ui
        shell: pwsh
        run: .\gradlew.bat createDistributable --no-daemon

      - name: Verify packaged desktop JVM policy
        shell: pwsh
        working-directory: desktop_ui
        run: |
          $ErrorActionPreference = 'Stop'
          $launcherConfig = Get-ChildItem -LiteralPath 'build\compose\binaries\main\app' -Filter 'HLSDownloader.cfg' -Recurse -File | Select-Object -First 1
          if (-not $launcherConfig) { throw 'Compose launcher configuration is missing from createDistributable output.' }
          $config = Get-Content -LiteralPath $launcherConfig.FullName -Raw -Encoding UTF8
          foreach ($required in @(
            '-Dskiko.renderApi=SOFTWARE',
            '-Dcompose.accessibility.enable=true',
            '-Djavax.accessibility.assistive_technologies=com.sun.java.accessibility.AccessBridge'
          )) {
            if (-not $config.Contains($required)) { throw "Packaged launcher is missing required JVM option: $required" }
          }

  extension:
    name: Browser extensions
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install extension dependencies
        working-directory: extension
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Test and build browser extensions
        working-directory: extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm test
          pnpm run build

  test:
    name: test
    needs: [validate, rust_core, presenter, compose, extension]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every v7 source gate
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          RUST_CORE_RESULT: ${{ needs.rust_core.result }}
          PRESENTER_RESULT: ${{ needs.presenter.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
        run: |
          for result in "$VALIDATE_RESULT" "$RUST_CORE_RESULT" "$PRESENTER_RESULT" "$COMPOSE_RESULT" "$EXTENSION_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required v7 CI job did not succeed: $result"
              exit 1
            fi
          done
