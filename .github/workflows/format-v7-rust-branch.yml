name: Temporary v7 Rust Format

on:
  push:
    branches:
      - chatgpt/v7-release-gate-hardening
    paths:
      - '.github/workflows/format-v7-rust-branch.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-release-gate-hardening
          fetch-depth: 0

      - name: Set up Rust 1.98.1 rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Format both Rust crates and push deterministic diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path native_shell/Cargo.toml --all
          cargo fmt --manifest-path presenter_ui/Cargo.toml --all
          if (-not (git status --porcelain -- native_shell presenter_ui)) {
            Write-Host 'Rust sources already formatted.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- native_shell presenter_ui
          git commit -m 'style: apply Rust 1.98.1 rustfmt'
          git push origin HEAD:chatgpt/v7-release-gate-hardening
