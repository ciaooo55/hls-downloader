name: Temporary v7 extension security upgrade

on:
  push:
    branches:
      - chatgpt/v7-maintenance-security-audit
    paths:
      - '.github/workflows/tmp-v7-extension-upgrade.yml'
      - 'extension/pnpm-workspace.yaml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-maintenance-security-audit

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.20.0'

      - name: Upgrade vulnerable extension tooling and verify
        shell: pwsh
        working-directory: extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm up --save-exact wxt@0.21.4 web-ext@10.6.0 vitest@3.2.6
          pnpm install --lockfile-only
          pnpm audit --audit-level=high
          pnpm test
          pnpm run build:firefox
          pnpm exec web-ext lint --source-dir .output/firefox-mv3

      - name: Commit verified package and lockfile changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/package.json extension/pnpm-lock.yaml
          if (git diff --cached --quiet) { throw 'Expected extension dependency changes were not produced.' }
          git commit -m 'build: update vulnerable extension tooling'
          git push origin HEAD:chatgpt/v7-maintenance-security-audit
