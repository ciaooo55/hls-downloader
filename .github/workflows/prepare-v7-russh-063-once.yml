name: v7 One-shot russh 0.63 Compatibility

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  prepare:
    if: ${{ github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'maintenance:prepare-v7.0.2-russh-0.63.2' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out russh upgrade branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-0-2-russh-0-63-2
          fetch-depth: 0

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Adapt TOFU handler to PublicKeyOrCertificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'native_shell\src\sftp_live.rs'
          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $oldImport = 'use russh::keys::{load_secret_key, PrivateKeyWithHashAlg, PublicKey};'
          $newImport = 'use russh::keys::{load_secret_key, PrivateKeyWithHashAlg, PublicKey, PublicKeyOrCertificate};'
          if (-not $text.Contains($oldImport)) { throw 'Expected russh key import was not found.' }
          $text = $text.Replace($oldImport, $newImport)
          $oldSignature = @'
    async fn check_server_key(
        &mut self,
        server_public_key: &PublicKey,
    ) -> Result<bool, Self::Error> {
        match crate::sftp_engine::tofu_record(
            &self.host,
            self.port,
            &fingerprint_host_key(server_public_key),
        ) {
'@
          $newSignature = @'
    async fn check_server_key(
        &mut self,
        server_public_key: &PublicKeyOrCertificate,
    ) -> Result<bool, Self::Error> {
        let server_public_key = server_public_key.public_key();
        match crate::sftp_engine::tofu_record(
            &self.host,
            self.port,
            &fingerprint_host_key(&server_public_key),
        ) {
'@
          if (-not $text.Contains($oldSignature)) { throw 'Expected check_server_key implementation was not found.' }
          $text = $text.Replace($oldSignature, $newSignature)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          cargo fmt --manifest-path native_shell/Cargo.toml --all -- --check
          git diff --check

      - name: Run Rust Core tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --manifest-path native_shell/Cargo.toml --lib -- --test-threads=1

      - name: Commit compatibility update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native_shell/src/sftp_live.rs
          if (git diff --cached --quiet) { throw 'russh compatibility preparation produced no changes.' }
          git commit -m 'fix: adapt SFTP host key check to russh 0.63'
          git push origin HEAD:chatgpt/v7-0-2-russh-0-63-2
