name: Temporary v7 release resume patch

on:
  push:
    branches:
      - chatgpt/v7-release-safe-resume
    paths:
      - '.github/workflows/tmp-v7-release-resume-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-release-safe-resume
      - name: Apply verified text patch
        shell: pwsh
        run: .\scripts\tmp-patch-v7-release-resume.ps1
      - name: Commit patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-v7.yml docs/v7-release-runner.md
          if (git diff --cached --quiet) { throw 'Expected release resume changes were not produced.' }
          git commit -m 'release: make formal draft publishing safely resumable'
          git push origin HEAD:chatgpt/v7-release-safe-resume
