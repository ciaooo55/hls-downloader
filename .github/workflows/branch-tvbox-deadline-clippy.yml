name: TVBox deadline clippy repair
on:
  push:
    branches: ["网页版gpt"]
    paths:
      - ".github/branch_tvbox_response_deadline_clippy_fix.py"
      - ".github/workflows/branch-tvbox-deadline-clippy.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "网页版gpt"
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: clippy,rustfmt
      - name: Apply repair
        shell: pwsh
        run: python .github/branch_tvbox_response_deadline_clippy_fix.py
      - name: Validate repair
        shell: pwsh
        run: |
          cd native_shell
          cargo fmt --all
          cargo test --locked --lib tvbox_http_response_has_total_read_deadline -- --test-threads=1
          cargo clippy --locked --all-targets -- -D warnings -A dead_code -A clippy::large_enum_variant -A clippy::too_many_arguments -A clippy::type_complexity
      - name: Commit repair and cleanup
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/cast.rs
          git commit -m "test(cast): satisfy TVBox deadline clippy gate"
          git rm .github/branch_tvbox_response_deadline_clippy_fix.py .github/workflows/branch-tvbox-deadline-clippy.yml
          git commit -m "chore(branch): remove temporary TVBox deadline clippy repair"
          git fetch origin "网页版gpt"
          git rebase "origin/网页版gpt"
          git push origin "HEAD:网页版gpt"
