name: Branch media push retry terminal hardening

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-media-push-retry-terminal.yml"

permissions:
  contents: write

jobs:
  patch-media-push-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "网页版gpt"
          fetch-depth: 0
      - name: Apply patch
        run: python .github/branch_media_push_retry_terminal.py
      - name: Check and commit exact files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' desktop_ui/src/main/kotlin/com/hlsdownloader/desktop/Main.kt desktop_ui/src/main/kotlin/com/hlsdownloader/desktop/MediaPushUiState.kt desktop_ui/src/test/kotlin/com/hlsdownloader/desktop/MediaPushUiStateTest.kt | sort)"
          test "$changed" = "$expected" || { echo "Unexpected changed files:"; printf '%s\n' "$changed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop_ui/src/main/kotlin/com/hlsdownloader/desktop/Main.kt desktop_ui/src/main/kotlin/com/hlsdownloader/desktop/MediaPushUiState.kt desktop_ui/src/test/kotlin/com/hlsdownloader/desktop/MediaPushUiStateTest.kt
          git commit -m "fix(media-push): stop retrying terminal core rejection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
