name: One-shot Rust Lint Cleanup Retry

on:
  push:
    branches:
      - chatgpt/v7-release-gate-hardening
    paths:
      - '.github/workflows/_maint-rust-lints-retry.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-release-gate-hardening
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'
          components: clippy,rustfmt
      - name: Apply reviewed Rust cleanup
        shell: pwsh
        run: python scripts/_maint_rust_lints.py
      - name: Format and verify focused HLS synchronization
        working-directory: native_shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all
          cargo test --locked --lib media::hls::tests::authenticated_live_pause_resume_restores_atomic_timeline -- --test-threads=1
      - name: Verify full Rust Core
        working-directory: native_shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --lib -- --test-threads=1
          cargo build --locked --bin HLSDownloaderUpdater
          cargo clippy --locked --all-targets -- -D warnings -A dead_code -A clippy::large_enum_variant -A clippy::too_many_arguments -A clippy::type_complexity
      - name: Commit verified cleanup and remove maintenance files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_maint-rust-lints.yml .github/workflows/_maint-rust-lints-retry.yml scripts/_maint_rust_lints.py
          git add native_shell
          git commit -m 'refactor: clean Rust 1.98 clippy warnings'
          git push origin HEAD:chatgpt/v7-release-gate-hardening
