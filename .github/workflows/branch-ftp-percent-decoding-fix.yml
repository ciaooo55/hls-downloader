name: Branch strict FTP percent decoding

on:
  push:
    branches:
      - '网页版gpt'
    paths:
      - '.github/workflows/branch-ftp-percent-decoding-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.ref == 'refs/heads/网页版gpt'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '网页版gpt'
          fetch-depth: 0

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'
          components: rustfmt

      - name: Apply exact FTP decoding patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = @'
          from pathlib import Path

          path = Path("native_shell/src/ftp_engine.rs")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '''    let user = percent_decode(user);\n    let password = percent_decode(password);\n''',
              '''    let user = percent_decode(user)?;\n    let password = percent_decode(password)?;\n''',
              1,
          )
          text = text.replace(
              '''    let path = format!("/{}", percent_decode(path.trim_start_matches('/')));\n''',
              '''    let path = format!("/{}", percent_decode(path.trim_start_matches('/'))?);\n''',
              1,
          )

          old_decode = '''fn percent_decode(value: &str) -> String {
              let bytes = value.as_bytes();
              let mut out = Vec::with_capacity(bytes.len());
              let mut index = 0;
              while index < bytes.len() {
                  if bytes[index] == b'%' && index + 2 < bytes.len() {
                      if let Ok(decoded) = u8::from_str_radix(
                          std::str::from_utf8(&bytes[index + 1..index + 3]).unwrap_or(""),
                          16,
                      ) {
                          out.push(decoded);
                          index += 3;
                          continue;
                      }
                  }
                  out.push(bytes[index]);
                  index += 1;
              }
              String::from_utf8_lossy(&out).into_owned()
          }
          '''
          new_decode = '''fn percent_decode(value: &str) -> Result<String, String> {
              let bytes = value.as_bytes();
              let mut out = Vec::with_capacity(bytes.len());
              let mut index = 0;
              while index < bytes.len() {
                  if bytes[index] == b'%' {
                      if index + 2 >= bytes.len() {
                          return Err("FTP URL percent escape is incomplete".into());
                      }
                      let encoded = std::str::from_utf8(&bytes[index + 1..index + 3])
                          .map_err(|_| "FTP URL percent escape is invalid".to_string())?;
                      let decoded = u8::from_str_radix(encoded, 16)
                          .map_err(|_| "FTP URL percent escape is invalid".to_string())?;
                      out.push(decoded);
                      index += 3;
                      continue;
                  }
                  out.push(bytes[index]);
                  index += 1;
              }
              String::from_utf8(out)
                  .map_err(|_| "FTP URL percent-decoded value is not valid UTF-8".to_string())
          }
          '''
          if text.count(old_decode) != 1:
              raise SystemExit(f"expected one FTP percent decoder, found {text.count(old_decode)}")
          text = text.replace(old_decode, new_decode, 1)

          test_marker = '''        assert!(parse_ftp_url("ftp://alice%0d%0aPASS%20x@files.example/a.bin").is_err());
                  assert!(parse_ftp_url("ftp://files.example/a%0d%0aSITE%20EXEC%20x").is_err());
              }
          '''
          test_replacement = '''        assert!(parse_ftp_url("ftp://alice%0d%0aPASS%20x@files.example/a.bin").is_err());
                  assert!(parse_ftp_url("ftp://files.example/a%0d%0aSITE%20EXEC%20x").is_err());
                  for malformed in [
                      "ftp://files.example/a%",
                      "ftp://files.example/a%2",
                      "ftp://files.example/a%GG.bin",
                      "ftp://alice%GG@files.example/a.bin",
                  ] {
                      let error = parse_ftp_url(malformed).unwrap_err();
                      assert!(error.contains("percent escape"), "{malformed}: {error}");
                  }
                  let invalid_utf8 = parse_ftp_url("ftp://files.example/a%FF.bin").unwrap_err();
                  assert!(invalid_utf8.contains("valid UTF-8"), "{invalid_utf8}");
              }
          '''
          if text.count(test_marker) != 1:
              raise SystemExit(f"expected one FTP parse test marker, found {text.count(test_marker)}")
          text = text.replace(test_marker, test_replacement, 1)
          path.write_text(text, encoding="utf-8")
          '@
          $patch | python -

      - name: Format and compile Rust Core
        shell: pwsh
        working-directory: native_shell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked

      - name: Run focused FTP regressions
        shell: pwsh
        working-directory: native_shell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --lib ftp_engine::tests::parses_userinfo_and_ftps_port -- --exact --nocapture
          cargo test --locked --lib ftp_engine::tests -- --test-threads=1

      - name: Commit only validated FTP source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/branch-ftp-percent-decoding-fix.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'native_shell/src/ftp_engine.rs' '.github/workflows/branch-ftp-percent-decoding-fix.yml'
          git diff --cached --check
          $files = @(git diff --cached --name-only)
          if ($files.Count -ne 2 -or $files -notcontains 'native_shell/src/ftp_engine.rs' -or $files -notcontains '.github/workflows/branch-ftp-percent-decoding-fix.yml') {
            throw "Unexpected staged files: $($files -join ', ')"
          }
          git commit -m 'fix(ftp): reject malformed percent-encoded URLs'
          git push origin 'HEAD:网页版gpt'
