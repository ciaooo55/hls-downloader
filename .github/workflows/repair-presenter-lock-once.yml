name: Repair Presenter Lock Once

on:
  push:
    branches:
      - chatgpt/v7-0-2-russh-0-63-2
    paths:
      - .github/workflows/repair-presenter-lock-once.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-0-2-russh-0-63-2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: Regenerate presenter lockfile
        working-directory: presenter_ui
        run: cargo generate-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- presenter_ui/Cargo.lock; then
            echo "Presenter lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presenter_ui/Cargo.lock
          git commit -m "build: sync presenter lock for russh 0.63"
          git push origin HEAD:chatgpt/v7-0-2-russh-0-63-2
