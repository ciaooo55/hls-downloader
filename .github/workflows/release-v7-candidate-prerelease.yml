name: v7 Candidate Prerelease

on:
  issues:
    types: [opened]

concurrency:
  group: v7-candidate-prerelease
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.issue.title == 'release:v7.0.1-candidate.1' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v7.0.1-candidate.1
      SOURCE_SHA: 26cd6a6f5ef0be30f5b40d6a60307bfd7f7bfce6
      ARTIFACT_ID: '10012816450'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Verify tag and validated source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          test "$(git show "$SOURCE_SHA:artifacts/v7-productization/feature-parity.json" | jq -r '.product_version')" = "7.0.1"
          test "$(git show "$SOURCE_SHA:artifacts/v7-productization/feature-parity.json" | jq -r '.release_ready')" = "true"

      - name: Download successful candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > candidate-artifact.zip
          unzip -q candidate-artifact.zip -d candidate-artifact
          manifest="$(find candidate-artifact -name ARTIFACT-MANIFEST.json -type f -print -quit)"
          test -n "$manifest"
          root="$(dirname "$manifest")"
          echo "CANDIDATE_ROOT=$root" >> "$GITHUB_ENV"
          jq -e --arg sha "$SOURCE_SHA" '.product_version == "7.0.1" and .package_tier == "candidate" and .source_commit == $sha' "$manifest" >/dev/null

      - name: Verify candidate manifest SHA-256 entries
        shell: bash
        run: |
          set -euo pipefail
          manifest="$CANDIDATE_ROOT/ARTIFACT-MANIFEST.json"
          cd "$CANDIDATE_ROOT"
          for key in exe msi portable; do
            path="$(jq -r ".artifacts.$key.path" ARTIFACT-MANIFEST.json)"
            expected="$(jq -r ".artifacts.$key.sha256" ARTIFACT-MANIFEST.json)"
            test -f "$path"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            test "$actual" = "$expected"
          done
          while IFS=$'\t' read -r expected path; do
            test -f "$path"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            test "$actual" = "$expected"
          done < <(jq -r '.extensions | to_entries[] | [.value.sha256, .value.path] | @tsv' ARTIFACT-MANIFEST.json)

      - name: Create candidate tag and prerelease
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "HLS Downloader 7.0.1 candidate prerelease"
          git push origin "$RELEASE_TAG"
          mapfile -t assets < <(find "$CANDIDATE_ROOT" -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -ge 4
          cat > release-notes.md <<'EOF'
          HLS Downloader 7.0.1 candidate prerelease.

          This prerelease is built from the fully successful v7 Candidate Package run for commit 26cd6a6f5ef0be30f5b40d6a60307bfd7f7bfce6. The workflow re-validates ARTIFACT-MANIFEST.json and every listed SHA-256 before upload.

          Windows binaries in this prerelease are candidate artifacts and are not the final Authenticode-signed v7.0.1 release. The final stable release remains reserved for the dedicated hls-release Windows signing runner.
          EOF
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "HLS Downloader 7.0.1 Candidate 1" --notes-file release-notes.md --prerelease --verify-tag

      - name: Verify uploaded asset sizes and digests
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          mapfile -t assets < <(find "$CANDIDATE_ROOT" -maxdepth 1 -type f -print | sort)
          remote_count="$(jq '.assets | length' <<<"$release_json")"
          test "$remote_count" -eq "${#assets[@]}"
          for file in "${assets[@]}"; do
            name="$(basename "$file")"
            size="$(stat -c '%s' "$file")"
            sha="$(sha256sum "$file" | awk '{print $1}')"
            remote_size="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size' <<<"$release_json")"
            remote_digest="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest' <<<"$release_json")"
            test "$remote_size" = "$size"
            test "$remote_digest" = "sha256:$sha"
          done
