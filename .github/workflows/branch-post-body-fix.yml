name: Branch HTTPS POST body fix

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-post-body-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "网页版gpt"

      - name: Guard target branch
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }

      - name: Apply POST body patch
        run: python .github/scripts/apply_post_body_fix.py

      - name: Format Rust
        run: cargo fmt --manifest-path native_shell/Cargo.toml

      - name: Check native shell
        run: cargo check --manifest-path native_shell/Cargo.toml

      - name: Run focused POST regressions
        run: |
          cargo test --manifest-path native_shell/Cargo.toml curl_request_args_preserve_post_body_without_inventing_content_type
          cargo test --manifest-path native_shell/Cargo.toml winhttp_posts_the_job_body_bytes

      - name: Commit tested core patch on target branch only
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/http_engine.rs
          git commit -m "fix(http): preserve POST bodies across Windows transports"
          git push origin HEAD:"网页版gpt"
