name: Branch media mount ownership hardening

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-media-mount-ownership.yml"

permissions:
  contents: write

jobs:
  patch-media-mounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "网页版gpt"
          fetch-depth: 0

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Apply ownership patch
        run: python .github/branch_media_mount_ownership.py

      - name: Format, verify and commit product change
        shell: bash
        run: |
          set -euo pipefail
          (cd native_shell && cargo fmt --all)
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'native_shell/src/cast.rs\nnative_shell/src/download_worker.rs'
          test "$changed" = "$expected" || { echo "Unexpected changed files:"; printf '%s\n' "$changed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/cast.rs native_shell/src/download_worker.rs
          git commit -m "fix(cast): resolve LAN route before mounting media"

      - name: Remove temporary branch patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/branch_media_mount_ownership.py .github/workflows/branch-media-mount-ownership.yml
          git commit -m "chore(branch): remove temporary LAN mount patch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
