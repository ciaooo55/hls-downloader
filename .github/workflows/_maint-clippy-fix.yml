name: Temporary Clippy Fix

on:
  push:
    branches:
      - chatgpt/v7-release-gate-hardening
    paths:
      - '.github/workflows/_maint-clippy-fix.yml'
      - 'native_shell/**'

permissions:
  contents: write

jobs:
  clippy-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native_shell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-release-gate-hardening
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - name: Apply machine-applicable Clippy fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo clippy --fix --locked --all-targets --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          exit 0
      - name: Commit fixes
        working-directory: .
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native_shell
          if (-not (git diff --cached --quiet)) {
            git commit -m 'style: apply machine-applicable clippy fixes'
            git push origin HEAD:chatgpt/v7-release-gate-hardening
          }
