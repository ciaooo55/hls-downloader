name: v7 One-shot Version Bump

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  bump:
    if: ${{ github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'maintenance:bump-v7.0.2' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'

      - name: Bump source versions and regenerate lockfiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & .\scripts\bump-v7-version.ps1 -Version 7.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile --manifest-path native_shell/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile --manifest-path presenter_ui/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify synchronized version contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $feature = Get-Content artifacts/v7-productization/feature-parity.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($feature.product_version -ne '7.0.2') { throw 'feature parity version bump failed' }
          if ($feature.release_ready) { throw '7.0.2 must begin as an iteration, not release-ready' }
          foreach ($file in @('native_shell/Cargo.toml','presenter_ui/Cargo.toml','extension/package.json','desktop_ui/build.gradle.kts','desktop_ui/src/main/kotlin/com/hlsdownloader/desktop/Protocol.kt')) {
            if (-not (Select-String -LiteralPath $file -Pattern '7\.0\.2' -Quiet)) { throw "$file did not receive 7.0.2" }
          }
          cargo metadata --locked --no-deps --format-version 1 --manifest-path native_shell/Cargo.toml | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'native_shell Cargo.lock is not usable with --locked' }
          cargo metadata --locked --no-deps --format-version 1 --manifest-path presenter_ui/Cargo.toml | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'presenter_ui Cargo.lock is not usable with --locked' }

      - name: Commit 7.0.2 iteration start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md artifacts/v7-productization/feature-parity.json native_shell/Cargo.toml native_shell/Cargo.lock presenter_ui/Cargo.toml presenter_ui/Cargo.lock extension/package.json desktop_ui/build.gradle.kts desktop_ui/src/main/kotlin/com/hlsdownloader/desktop/Protocol.kt
          if (-not (git diff --cached --quiet)) {
            git commit -m 'build: start v7.0.2 iteration'
            git push origin HEAD:main
          } else {
            throw 'Version bump produced no staged changes.'
          }
