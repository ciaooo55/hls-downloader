name: v7 Candidate Package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-v7-candidate.yml'
      - 'scripts/bootstrap-v7-media-tools.ps1'
      - 'scripts/bootstrap-v7-toolchain.ps1'
      - 'scripts/build-v7.ps1'
      - 'scripts/validate-powershell.ps1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Build Windows candidate artifacts
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      HLS_V7_BUILD_CACHE: ${{ runner.temp }}\\hls-v7-build-cache
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'

      - name: Set up Node 24.20.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.20.0'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          if ((pnpm --version).Trim() -ne '11.7.0') { throw 'pnpm 11.7.0 activation failed.' }

      - name: Bootstrap pinned JDK and FFmpeg
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\\scripts\\bootstrap-v7-toolchain.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mediaDir = & .\\scripts\\bootstrap-v7-media-tools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([String]::IsNullOrWhiteSpace($mediaDir)) { throw 'FFmpeg bootstrap did not return a media directory.' }
          "media_dir=$mediaDir" >> $env:GITHUB_OUTPUT

      - name: Build v7 candidate package
        shell: pwsh
        env:
          HLS_V7_JAVA_HOME: ${{ runner.temp }}\\hls-v7-build-cache\\jdk-21
          HLS_V7_FFMPEG_DIR: ${{ steps.toolchain.outputs.media_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:HLS_V7_PNPM = (Get-Command pnpm.cmd -ErrorAction Stop).Source
          & .\\scripts\\build-v7.ps1 -Task candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = 'artifacts\\v7-productization\\candidate\\ARTIFACT-MANIFEST.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "Candidate manifest is missing: $manifest" }
          Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null

      - name: Upload candidate installers and extensions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HLSDownloader-v7-candidate-${{ github.sha }}
          path: artifacts/v7-productization/candidate/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
