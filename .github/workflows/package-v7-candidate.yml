name: v7 Candidate Package

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Build Windows candidate artifacts
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set isolated v7 build cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'hls-v7-build-cache'
          "HLS_V7_BUILD_CACHE=$cacheRoot" >> $env:GITHUB_ENV
          "CARGO_BUILD_JOBS=1" >> $env:GITHUB_ENV

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'

      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          if ((pnpm --version).Trim() -ne '11.7.0') { throw 'pnpm 11.7.0 activation failed.' }

      - name: Prepare packaged validation dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check psutil==7.2.2
          python -c "import psutil; assert psutil.__version__ == '7.2.2'"

      - name: Bootstrap pinned FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mediaDir = & .\scripts\build\bootstrap-v7-media-tools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([String]::IsNullOrWhiteSpace($mediaDir)) { throw 'FFmpeg bootstrap did not return a media directory.' }
          "HLS_V7_FFMPEG_DIR=$mediaDir" >> $env:GITHUB_ENV

      - name: Build v7 candidate package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:HLS_V7_PNPM = (Get-Command pnpm.cmd -ErrorAction Stop).Source
          & .\scripts\build-v7.ps1 -Task candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = 'artifacts\v7-productization\candidate\ARTIFACT-MANIFEST.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "Candidate manifest is missing: $manifest" }
          Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null

      - name: Audit candidate package size
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\build\report-v7-package-size.ps1 -MaxArtifactMiB 384
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload candidate installers and extensions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HLSDownloader-v7-candidate-${{ github.sha }}
          path: artifacts/v7-productization/candidate/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Verify packaged portable upgrade and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content artifacts\v7-productization\candidate\ARTIFACT-MANIFEST.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $archive = Join-Path 'artifacts\v7-productization\candidate' ([string]$manifest.artifacts.portable.path)
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\validation\smoke-v7-portable-upgrade.ps1 -ArchivePath $archive
          if ($LASTEXITCODE -ne 0) { throw 'Packaged portable upgrade/rollback failed.' }

      - name: Verify packaged components without desktop automation
        id: headless_validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packageRoot = 'artifacts\v7-productization\candidate'
          $manifestPath = Join-Path $packageRoot 'ARTIFACT-MANIFEST.json'
          $manifest = Get-Content $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:GITHUB_SHA) { throw 'Candidate source identity changed.' }
          $reports = 'artifacts\v7-productization\candidate-validation'
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          $image = Join-Path $env:HLS_V7_BUILD_CACHE 'runtime-validation'
          if (Test-Path -LiteralPath $image) { throw 'Runtime validation requires a fresh image directory.' }
          $archive = Join-Path $packageRoot ([string]$manifest.artifacts.portable.path)
          Expand-Archive -LiteralPath $archive -DestinationPath $image
          try {
            $app = Join-Path $image 'HLSDownloader'
            $resources = Join-Path $app 'app\resources'
            $engine = Join-Path $resources 'HLSDownloaderEngine.exe'
            $cli = Join-Path $resources 'HLSDownloaderCli.exe'
            $hostExe = Join-Path $resources 'HLSDownloaderNativeHost.exe'
            # These self-tests do not show windows or drive the desktop.
            & (Join-Path $app 'HLSDownloader.exe') --self-test
            & (Join-Path $resources 'HLSDownloaderPresenter.exe') --self-test
            & $engine --self-test
            python scripts/validation/windows_breakaway_job.py python scripts/validation/free_parity_acceptance.py --isolated-engine $engine --isolated-cli $cli --report "$reports/free-functions.json"
            python scripts/validation/windows_breakaway_job.py python scripts/validation/smoke_v7_native_host.py --host $hostExe --engine $engine --concurrent-hosts 4 --profile-startup --report "$reports/native-host.json"
            python scripts/validation/verify_v7_host_job_lifetime.py --resources $resources --report "$reports/host-job-lifetime.json"
            python scripts/validation/smoke_v7_transfer_performance.py --engine $engine --report "$reports/transfer-performance.json"
            python scripts/validation/soak_v7_runtime.py --engine $engine --idle-seconds 60 --stress-requests 18000 --report "$reports/runtime-soak.json"
            $reportHashes = [ordered]@{}
            foreach ($name in @('free-functions', 'native-host', 'host-job-lifetime', 'transfer-performance', 'runtime-soak')) {
              $reportPath = Join-Path $reports "$name.json"
              $reportHashes["$name.json"] = (Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            [ordered]@{
              schema = 1
              source_commit = $env:GITHUB_SHA
              candidate_artifact_manifest_sha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
              passed = $true
              scope = 'Packaged headless component tests; no browser, GUI, DPI or accessibility acceptance.'
              reports = $reportHashes
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$reports/headless-validation.json" -Encoding utf8
          } finally {
            Remove-Item -LiteralPath $image -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload packaged component validation
        if: always() && steps.headless_validation.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HLSDownloader-v7-candidate-validation-${{ github.sha }}
          path: artifacts/v7-productization/candidate-validation/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify real MSI upgrade and failure rollback on isolated Windows
        id: msi_lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HLS_V7_PYTHON = (Get-Command python.exe -ErrorAction Stop).Source
          foreach ($scenario in @('Upgrade', 'FailureRollback')) {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\validation\verify-v7-msi-lifecycle.ps1 -Scenario $scenario -ApplicationLaunchMode Wmi -CandidateManifestPath artifacts\v7-productization\candidate\ARTIFACT-MANIFEST.json
            if ($LASTEXITCODE -ne 0) { throw "MSI lifecycle failed: $scenario" }
          }

      - name: Upload MSI lifecycle evidence
        if: always() && steps.msi_lifecycle.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HLSDownloader-v7-msi-lifecycle-${{ github.sha }}
          path: |
            artifacts/v7-productization/msi-lifecycle/*.json
            artifacts/v7-productization/msi-lifecycle/*.log
            artifacts/v7-productization/msi-lifecycle/*-checkpoint/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify EXE installation and visible shortcut startup
        id: exe_startup
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\validation\verify-v7-exe-startup.ps1 -CandidateManifestPath artifacts\v7-productization\candidate\ARTIFACT-MANIFEST.json
          if ($LASTEXITCODE -ne 0) { throw 'EXE installation/startup regression failed.' }

      - name: Upload EXE startup evidence
        if: always() && steps.exe_startup.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HLSDownloader-v7-exe-startup-${{ github.sha }}
          path: artifacts/v7-productization/exe-startup/**
          if-no-files-found: error
          retention-days: 14
