name: v7 Candidate Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-v7-candidate.yml'
      - 'native_shell/**'
      - 'presenter_ui/**'
      - 'desktop_ui/**'
      - 'extension/**'
      - 'assets/**'
      - 'artifacts/v7-productization/feature-parity.json'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/package-v7-candidate.yml'
      - 'native_shell/**'
      - 'presenter_ui/**'
      - 'desktop_ui/**'
      - 'extension/**'
      - 'assets/**'
      - 'artifacts/v7-productization/feature-parity.json'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Build Windows candidate artifacts
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set isolated v7 build cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'hls-v7-build-cache'
          "HLS_V7_BUILD_CACHE=$cacheRoot" >> $env:GITHUB_ENV
          "HLS_V7_JAVA_HOME=$(Join-Path $cacheRoot 'jdk-21')" >> $env:GITHUB_ENV

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'

      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          if ((pnpm --version).Trim() -ne '11.7.0') { throw 'pnpm 11.7.0 activation failed.' }

      - name: Bootstrap pinned JDK and FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\bootstrap-v7-toolchain.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mediaDir = & .\scripts\bootstrap-v7-media-tools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([String]::IsNullOrWhiteSpace($mediaDir)) { throw 'FFmpeg bootstrap did not return a media directory.' }
          "HLS_V7_FFMPEG_DIR=$mediaDir" >> $env:GITHUB_ENV

      - name: Build v7 candidate package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:HLS_V7_PNPM = (Get-Command pnpm.cmd -ErrorAction Stop).Source
          & .\scripts\build-v7.ps1 -Task candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = 'artifacts\v7-productization\candidate\ARTIFACT-MANIFEST.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "Candidate manifest is missing: $manifest" }
          Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json | Out-Null

      - name: Audit candidate package size
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\report-v7-package-size.ps1 -MaxArtifactMiB 384
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload candidate installers and extensions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HLSDownloader-v7-candidate-${{ github.sha }}
          path: artifacts/v7-productization/candidate/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
