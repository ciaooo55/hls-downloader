# Branch-local fast check; full v7 CI covers every 网页版gpt push, including cast state and release-gate hardening.
name: Branch media push wrapper validation

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-media-push-wrapper-validation.yml"
      - "scripts/test-v7-media-push-wrapper.ps1"
      - "scripts/verify-v7-browser-media-push.ps1"
      - "scripts/verify-v7-browser-media-push-core.ps1"

permissions:
  contents: read

jobs:
  validate-wrapper:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate wrapper in Windows PowerShell and PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-v7-media-push-wrapper.ps1
          pwsh.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-v7-media-push-wrapper.ps1
