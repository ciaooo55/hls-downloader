name: Repair branch proxy fix v2

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-proxy-route-fix-v2-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "网页版gpt"
      - name: Guard target branch
        shell: bash
        run: test "${{ github.ref_name }}" = "网页版gpt"
      - name: Repair malformed Python string and commit
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/branch-proxy-route-fix-v2.yml')
          s = p.read_text(encoding='utf-8')
          old = '              """# Proxy routing identity\\n\\n"\n'
          new = '              "# Proxy routing identity\\n\\n"\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one malformed doc string, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit only to target branch
        shell: bash
        run: |
          test "${{ github.ref_name }}" = "网页版gpt"
          git rm .github/workflows/branch-proxy-route-fix-v2-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/branch-proxy-route-fix-v2.yml
          git commit -m "chore(branch): fix proxy workflow Python syntax"
          git push origin HEAD:"网页版gpt"
