name: Branch proxy route fix v4

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-proxy-route-fix-v4.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "网页版gpt"

      - name: Guard target branch
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }

      - name: Apply hardened proxy patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/branch-proxy-route-fix-v3.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply proxy route identity patch\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Format Rust', start)
          raw = workflow[start:end]
          script_lines = []
          for line in raw.splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected patch indentation: {line!r}')
              else:
                  script_lines.append('')
          script = '\n'.join(script_lines) + '\n'

          fragile_start = script.index("manual_tail = '''")
          fragile_end_marker = 'block = block.replace(manual_tail, extra, 1)\n'
          fragile_end = script.index(fragile_end_marker, fragile_start) + len(fragile_end_marker)
          robust = '''extra = r''' + "'''" + '''
              assert_eq!(
                  effective_proxy("system", "http://127.0.0.1:9", "", "https://cdn.test/a", ""),
                  SYSTEM_PROXY_SENTINEL
              );
              assert_eq!(
                  effective_proxy(
                      "direct",
                      "http://127.0.0.1:9",
                      "",
                      "https://cdn.test/a",
                      SYSTEM_PROXY_SENTINEL
                  ),
                  SYSTEM_PROXY_SENTINEL
              );
              assert_eq!(
                  effective_proxy(
                      "direct",
                      "http://127.0.0.1:9",
                      "",
                      "https://cdn.test/a",
                      "http://127.0.0.1:7777"
                  ),
                  "http://127.0.0.1:7777"
              );
          ''' + "'''" + '''
          close = block.rfind("\n    }")
          if close < 0:
              raise SystemExit("net_policy test closing brace not found")
          block = block[:close] + "\n" + extra + block[close:]
          '''
          script = script[:fragile_start] + robust + script[fragile_end:]
          exec(compile(script, 'proxy-route-patch-v4', 'exec'), {})

      - name: Format Rust
        run: cargo fmt --manifest-path native_shell/Cargo.toml

      - name: Check native shell
        run: cargo check --manifest-path native_shell/Cargo.toml

      - name: Run proxy route regressions
        run: |
          cargo test --manifest-path native_shell/Cargo.toml proxy_route
          cargo test --manifest-path native_shell/Cargo.toml weekday_and_proxy_bypass

      - name: Commit tested core patch on target branch only
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "网页版gpt") { throw "ref guard failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/net_policy.rs native_shell/src/download_worker.rs native_shell/src/http_engine.rs docs/architecture/proxy-routing.md
          git commit -m "fix(net): preserve proxy route identity end-to-end"
          git push origin HEAD:"网页版gpt"
