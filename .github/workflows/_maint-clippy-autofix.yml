name: One-shot Clippy Autofix

on:
  push:
    branches:
      - chatgpt/v7-release-gate-hardening
    paths:
      - '.github/workflows/_maint-clippy-autofix.yml'

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native_shell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/v7-release-gate-hardening
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - name: Apply machine-applicable Clippy fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --fix --locked --all-targets --allow-dirty --allow-staged
          cargo fmt --all
      - name: Commit fixes and remove this workflow
        working-directory: .
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_maint-clippy-autofix.yml
          git add native_shell
          git commit -m 'style: apply clippy autofixes'
          git push origin HEAD:chatgpt/v7-release-gate-hardening
