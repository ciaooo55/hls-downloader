name: v7 Formal Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified draft as Latest after digest verification
        required: true
        type: boolean
        default: false
      edge_binary:
        description: Optional absolute Edge path on the hls-release runner
        required: false
        type: string
        default: ''
      firefox_binary:
        description: Optional absolute Firefox path on the hls-release runner
        required: false
        type: string
        default: ''

concurrency:
  group: v7-formal-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Verify and stage unsigned v7 release
    runs-on: [self-hosted, Windows, X64, hls-release]
    timeout-minutes: 180
    environment: v7-release
    defaults:
      run:
        working-directory: 'A:\Ubuntu\测试\hls-downloader'
    env:
      HLS_V7_TVBOX_EXPECTED_HOST: ${{ vars.HLS_V7_TVBOX_EXPECTED_HOST }}
      HLS_V7_EDGE_BINARY: ${{ inputs.edge_binary }}
      HLS_V7_FIREFOX_BINARY: ${{ inputs.firefox_binary }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse non-main or stale release source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw 'Formal release requires workflow_dispatch.' }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "Formal release must be dispatched from main, got $env:GITHUB_REF" }
          if ((git branch --show-current).Trim() -ne 'main') { throw 'Local release source must be on main.' }
          if (git status --porcelain) { throw 'Local release source must be clean.' }
          $head = (git rev-parse HEAD).Trim()
          $remoteMain = (git ls-remote origin refs/heads/main).Split("`t")[0].Trim()
          if ($head -ne $env:GITHUB_SHA -or $head -ne $remoteMain) { throw "Release source identity mismatch: HEAD=$head dispatch=$env:GITHUB_SHA main=$remoteMain" }
          $feature = Get-Content 'artifacts\v7-productization\feature-parity.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $version = [string]$feature.product_version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid product version: $version" }
          $tag = "v$version"
          $existingTag = ((git ls-remote --tags origin "refs/tags/$tag") -join '').Trim()
          $releaseMode = 'fresh'
          if ($existingTag) {
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $tagType = (git cat-file -t "refs/tags/$tag").Trim()
            if ($tagType -ne 'tag') { throw "Existing release tag is not annotated: $tag" }
            $tagCommit = (git rev-parse "refs/tags/$tag^{}").Trim()
            if ($tagCommit -ne $head) { throw "Existing release tag points at another commit: tag=$tagCommit HEAD=$head" }

            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent' = 'hls-downloader-release-workflow'
            }
            $release = $null
            try {
              $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers
            } catch {
              $status = 0
              if ($_.Exception.Response -and $_.Exception.Response.StatusCode) { $status = [int]$_.Exception.Response.StatusCode }
              if ($status -ne 404) { throw }
            }
            if ($release) {
              if (-not [bool]$release.draft) { throw "Release already exists and is not a draft: $tag" }
              $releaseMode = 'draft'
            } else {
              $releaseMode = 'tag-only'
            }
          }
          "HLS_V7_RELEASE_MODE=$releaseMode" >> $env:GITHUB_ENV
          "HLS_V7_VERSION=$version" >> $env:GITHUB_ENV
          "HLS_V7_TAG=$tag" >> $env:GITHUB_ENV
          $cacheRoot = Join-Path (Get-Location).Path '.tool-cache\build-cache'
          "HLS_V7_BUILD_CACHE=$cacheRoot" >> $env:GITHUB_ENV
          "HLS_V7_JAVA_HOME=$(Join-Path $cacheRoot 'jdk-21')" >> $env:GITHUB_ENV

      - name: Require successful exact-SHA source, candidate and security workflows
        shell: pwsh
        env:
          HLS_V7_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & .\scripts\assert-v7-exact-main-workflows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify dedicated Windows release runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $IsWindows -or $env:PROCESSOR_ARCHITECTURE -notmatch 'AMD64') { throw 'Formal v7 release requires Windows x64.' }
          Get-Command git.exe, python.exe, go.exe, gh.exe -ErrorAction Stop | Out-Null
          python.exe -c "import yaml"
          if ($LASTEXITCODE -ne 0) { throw 'Release runner Python must provide PyYAML for deterministic SBOM generation.' }

      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.98.1'

      - name: Set up Node 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pnpmRoot = Join-Path $env:HLS_V7_BUILD_CACHE 'pnpm-cli'
          npm.cmd install --prefix $pnpmRoot --ignore-scripts --no-audit --no-fund pnpm@11.7.0
          $env:PATH = "$pnpmRoot;$env:PATH"
          $pnpmRoot >> $env:GITHUB_PATH
          if ((pnpm --version).Trim() -ne '11.7.0') { throw 'pnpm 11.7.0 activation failed.' }

      - name: Bootstrap pinned JDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\bootstrap-v7-toolchain.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap pinned FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $output = @(& powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\bootstrap-v7-media-tools.ps1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mediaDir = @($output | Where-Object { -not [String]::IsNullOrWhiteSpace($_) }) | Select-Object -Last 1
          if ([String]::IsNullOrWhiteSpace($mediaDir) -or -not (Test-Path -LiteralPath $mediaDir -PathType Container)) { throw 'FFmpeg bootstrap did not return a valid media directory.' }
          "HLS_V7_FFMPEG_DIR=$mediaDir" >> $env:GITHUB_ENV
          "HLS_V7_PYTHON=$((Get-Command python.exe -ErrorAction Stop).Source)" >> $env:GITHUB_ENV

      - name: Receive frozen candidate and isolated MSI lifecycle evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $output = @(& .\scripts\receive-v7-candidate.ps1 -Repository $env:GITHUB_REPOSITORY)
          $receipt = $output[-1] | ConvertFrom-Json
          "HLS_V7_CANDIDATE_MANIFEST=$($receipt.candidate_manifest)" >> $env:GITHUB_ENV
          "HLS_V7_MSI_EVIDENCE=$($receipt.msi_evidence)" >> $env:GITHUB_ENV

      - name: Run browser, performance, browser media-push, installer and rollback gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\invoke-v7-release-gates.ps1 -CandidateManifestPath $env:HLS_V7_CANDIDATE_MANIFEST -MsiEvidenceRoot $env:HLS_V7_MSI_EVIDENCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reconfirm frozen main before formal package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          $remoteMain = (git ls-remote origin refs/heads/main).Split("`t")[0].Trim()
          if ($head -ne $env:GITHUB_SHA -or $head -ne $remoteMain) { throw "Source changed while release gates were running: HEAD=$head dispatch=$env:GITHUB_SHA main=$remoteMain" }

      - name: Build formal package from the same evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:HLS_V7_PNPM = (Get-Command pnpm.cmd -ErrorAction Stop).Source
          & .\scripts\build-v7.ps1 -Task package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Firefox store source bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm --dir extension install --frozen-lockfile
          pnpm --dir extension run zip:firefox-store
          $source = Get-ChildItem -LiteralPath 'extension\.output' -File -Recurse -Filter '*.zip' |
            Where-Object { $_.Name -match '(?i)sources' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $source) { throw 'Firefox store source ZIP was not produced.' }
          "HLS_V7_FIREFOX_SOURCES=$($source.FullName)" >> $env:GITHUB_ENV

      - name: Stage release assets and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\stage-v7-release.ps1 -FirefoxSources $env:HLS_V7_FIREFOX_SOURCES
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload verified release staging artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HLSDownloader-${{ env.HLS_V7_VERSION }}-formal-${{ github.sha }}
          path: 'A:/Ubuntu/测试/hls-downloader/artifacts/v7-productization/release-staging/**'
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create or resume annotated tag and draft GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $head = (git rev-parse HEAD).Trim()
          $remoteMain = (git ls-remote origin refs/heads/main).Split("`t")[0].Trim()
          if ($head -ne $env:GITHUB_SHA -or $head -ne $remoteMain) { throw 'Source changed before tag creation; refusing stale release.' }
          if ($env:HLS_V7_RELEASE_MODE -eq 'fresh') {
            git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' tag -a $env:HLS_V7_TAG -m "HLS Downloader $env:HLS_V7_VERSION" $head
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:HLS_V7_GIT_AUTH_HEADER = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
            try {
              git --config-env=http.https://github.com/.extraheader=HLS_V7_GIT_AUTH_HEADER push origin $env:HLS_V7_TAG
            } finally {
              Remove-Item Env:\HLS_V7_GIT_AUTH_HEADER
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($env:HLS_V7_RELEASE_MODE -notin @('tag-only', 'draft')) {
            throw "Unknown release resume mode: $env:HLS_V7_RELEASE_MODE"
          }

          $stage = (Resolve-Path 'artifacts\v7-productization\release-staging').Path
          $assetFiles = @(Get-ChildItem -LiteralPath $stage -File)
          $assets = @($assetFiles | Select-Object -ExpandProperty FullName)
          $expectedNames = @($assetFiles | Select-Object -ExpandProperty Name)
          $notes = Join-Path $stage "README-$env:HLS_V7_VERSION.txt"

          if ($env:HLS_V7_RELEASE_MODE -eq 'draft') {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:HLS_V7_TAG" | ConvertFrom-Json
            if (-not $release.draft) { throw 'Existing release stopped being a draft before resume.' }
            foreach ($existingAsset in @($release.assets)) {
              if ($existingAsset.name -notin $expectedNames) { throw "Draft release contains an unexpected asset: $($existingAsset.name)" }
            }
            gh release edit $env:HLS_V7_TAG --repo $env:GITHUB_REPOSITORY --title "HLS Downloader $env:HLS_V7_VERSION" --notes-file $notes --draft
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $env:HLS_V7_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $env:HLS_V7_TAG @assets --repo $env:GITHUB_REPOSITORY --title "HLS Downloader $env:HLS_V7_VERSION" --notes-file $notes --draft --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify uploaded GitHub asset size and SHA-256 digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:HLS_V7_TAG" | ConvertFrom-Json
          if (-not $release.draft) { throw 'Release must remain draft until all uploaded digests are verified.' }
          $stage = (Resolve-Path 'artifacts\v7-productization\release-staging').Path
          foreach ($file in Get-ChildItem -LiteralPath $stage -File) {
            $asset = @($release.assets | Where-Object { $_.name -eq $file.Name })
            if ($asset.Count -ne 1) { throw "Uploaded release asset missing or duplicated: $($file.Name)" }
            $sha = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([int64]$asset[0].size -ne [int64]$file.Length) { throw "Release asset size mismatch: $($file.Name)" }
            if ([string]$asset[0].digest -ne "sha256:$sha") { throw "Release asset digest mismatch: $($file.Name)" }
          }
          if (@($release.assets).Count -ne @(Get-ChildItem -LiteralPath $stage -File).Count) { throw 'Draft release contains an unexpected asset count.' }

      - name: Publish verified release as Latest
        if: ${{ inputs.publish }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          gh release edit $env:HLS_V7_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop release-owned processes
        if: always()
        shell: pwsh
        run: |
          & .\scripts\shutdown-running.ps1 -InstallDir 'E:\h'
          exit 0
