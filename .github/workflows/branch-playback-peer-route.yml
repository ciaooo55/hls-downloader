name: Branch playback peer route hardening

on:
  push:
    branches:
      - "网页版gpt"
    paths:
      - ".github/workflows/branch-playback-peer-route.yml"

permissions:
  contents: write

jobs:
  patch-peer-route:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "网页版gpt"
          fetch-depth: 0
      - name: Set up Rust 1.98.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - name: Apply peer route patch
        run: python .github/branch_playback_peer_route.py
      - name: Format and commit exact files
        shell: bash
        run: |
          set -euo pipefail
          (cd native_shell && cargo fmt --all)
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' native_shell/src/cast.rs native_shell/src/playback.rs | sort)"
          test "$changed" = "$expected" || { echo "Unexpected changed files:"; printf '%s\n' "$changed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_shell/src/cast.rs native_shell/src/playback.rs
          git commit -m "fix(cast): advertise media on receiver route"
          git push origin "HEAD:${GITHUB_REF_NAME}"
