version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      extension-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /native_shell
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-core:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /presenter_ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-presenter:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /desktop_ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compose-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
