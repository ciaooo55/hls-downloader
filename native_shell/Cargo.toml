[package]
name = "hls-native-shell"
version = "7.0.4"
edition = "2021"
description = "HLS Downloader 7 Rust Core, download engines, IPC, and Native Messaging"
publish = false

[features]
default = ["full-core"]
full-core = [
    "dep:rusqlite", "dep:tokio", "dep:tokio-tungstenite", "dep:rustls",
    "dep:futures-util", "dep:base64", "dep:russh", "dep:russh-sftp", "dep:schannel", "dep:roxmltree",
]

[dependencies]
hls-client = { path = "../crates/client" }
hls-protocol = { path = "../crates/protocol" }
rusqlite = { version = "0.40", features = ["bundled", "backup"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = { version = "0.21.2", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time", "sync"], optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"], optional = true }
# WebSocket 的 rustls 默认关闭加密提供者，必须显式启用，否则 wss 握手会 panic。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
base64 = { version = "0.23", optional = true }
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"], optional = true }
russh-sftp = { version = "3.0", optional = true }

[target.'cfg(windows)'.dependencies]
schannel = { version = "0.1", optional = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "hls_native_shell"
path = "src/lib.rs"

[[bin]]
name = "hls-downloader-engine"
path = "src/bin/hls_downloader_engine.rs"
required-features = ["full-core"]

[[test]]
name = "cast_simulated_lan_device"
path = "tests/cast_simulated_lan_device.rs"
required-features = ["full-core"]

[[test]]
name = "concurrent_dispatch"
path = "tests/concurrent_dispatch.rs"
required-features = ["full-core"]

[[test]]
name = "handoff_restore_order"
path = "tests/handoff_restore_order.rs"
required-features = ["full-core"]
