[package]
name = "hls-native-shell"
version = "5.0.0"
edition = "2021"
description = "Resident native supervisor: tray + pre-created confirm/progress/complete windows"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "hls_native_shell"
path = "src/lib.rs"

[[bin]]
name = "hls-native-shell"
path = "src/main.rs"
