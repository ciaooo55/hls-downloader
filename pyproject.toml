[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Start with correctness-oriented rules across legacy and current modules.
# This catches broken imports, undefined names and invalid control flow without
# forcing a release-wide style rewrite.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true

[tool.coverage.run]
source = ["backend.app"]
branch = true

[tool.coverage.report]
fail_under = 60
skip_covered = true
