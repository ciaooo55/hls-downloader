<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HLS Downloader</title>
  <style>
    html { color-scheme: light dark; background: #f2f3f6; }
    body { margin: 0; width: 360px; background: #f2f3f6; color: #0c111d; font: 12px/1.45 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
    .popup-boot { display: flex; min-height: 180px; flex-direction: column; background: #f2f3f6; }
    .popup-boot__header { display: flex; height: 56px; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #e2e5eb; background: #fff; }
    .popup-boot__header img { width: 28px; height: 28px; padding: 4px; box-sizing: border-box; border: 1px solid #e2e5eb; border-radius: 8px; }
    .popup-boot__title { font-size: 14px; font-weight: 700; }
    .popup-boot__status { margin-top: 1px; color: #475467; font-size: 11px; }
    .popup-boot__body { display: grid; flex: 1; place-items: center; padding: 24px; text-align: center; }
    .popup-boot__body strong { display: block; margin-bottom: 5px; font-size: 13px; }
    .popup-boot__body span { color: #475467; }
    @media (prefers-color-scheme: dark) {
      html, body, .popup-boot { background: #0f1115; color: #eef1f6; }
      .popup-boot__header, .popup-boot__header img { border-color: #2a2f39; background: #171a20; }
      .popup-boot__status, .popup-boot__body span { color: #b6bcc8; }
    }
  </style>
</head>
<body>
  <div id="root">
    <main class="popup-boot" role="status" aria-live="polite">
      <div class="popup-boot__header">
        <img src="/icon-32.png" alt="">
        <div>
          <div class="popup-boot__title">HLS Downloader</div>
          <div class="popup-boot__status">正在载入浏览器插件…</div>
        </div>
      </div>
      <div class="popup-boot__body">
        <div><strong>正在读取当前页面</strong><span>资源列表和下载操作马上显示</span></div>
      </div>
    </main>
  </div>
  <noscript>浏览器插件脚本未启用。</noscript>
  <script type="module" src="./main.ts"></script>
</body>
</html>
