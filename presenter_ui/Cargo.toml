[package]
name = "hls-native-ui"
version = "7.0.0"
edition = "2021"
description = "Native Windows presenter for HLS Downloader 7"
publish = false
autobins = false

[dependencies]
hls-native-shell = { path = "../native_shell", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.16"

[[bin]]
name = "hls-downloader-presenter"
path = "src/hot_main.rs"

[build-dependencies]
slint-build = "1.16"
winresource = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
