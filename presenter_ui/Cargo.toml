[package]
name = "hls-native-ui"
version = "7.0.3"
edition = "2021"
description = "Native Windows presenter for HLS Downloader 7"
publish = false
autobins = false

[dependencies]
hls-native-shell = { path = "../native_shell", default-features = false, features = ["presenter-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.16", features = ["unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "hls-downloader-presenter"
path = "src/hot_main.rs"

[build-dependencies]
slint-build = "1.16"
winresource = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
